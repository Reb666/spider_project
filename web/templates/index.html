<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>当当爬虫控制面板</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
  body { font-size: 14px; background: #f5f7fa; }
  .card { margin-bottom: 16px; }
  .table td, .table th { vertical-align: middle; white-space: nowrap; }
  .table td.name-col { max-width: 260px; overflow: hidden; text-overflow: ellipsis; }
  .status-idle { color: #6c757d; }
  .status-running { color: #198754; }
  .status-error { color: #dc3545; }
  .chart-box { width: 100%; height: 340px; }
  #crawlStatus { font-size: 13px; }
  .filter-row { margin-bottom: 6px; }
  .filter-row label { font-size: 12px; margin-bottom: 1px; color: #666; }
  #tableContainer { max-height: 420px; overflow-y: auto; }
  .page-link { cursor: pointer; }
  .section-label { font-size: 11px; color: #999; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
  .progress { height: 6px; }
</style>
</head>
<body>
<div class="container-fluid py-3">
  <h5 class="mb-3">当当图书爬虫控制面板</h5>

  <div class="row g-3">

    <!-- ===== 左栏 ===== -->
    <div class="col-lg-3">

      <!-- 爬虫控制 -->
      <div class="card">
        <div class="card-body">
          <h6 class="card-title">爬虫控制</h6>
          <div class="mb-2">
            <label class="form-label mb-1" style="font-size:13px">最大抓取条数（0=不限）</label>
            <input type="number" id="itemCount" class="form-control form-control-sm" value="50" min="0">
          </div>
          <button class="btn btn-success btn-sm w-100 mb-2" onclick="startCrawl()" id="btnCrawl">开始列表抓取</button>
          <button class="btn btn-outline-secondary btn-sm w-100 mb-2" onclick="startDetail()" id="btnDetail">详情评分补抓</button>
          <button class="btn btn-danger btn-sm w-100 mb-2" onclick="stopCrawl()" id="btnStop" disabled>停止爬虫</button>
          <div id="crawlStatus" class="status-idle">&#9679; 空闲</div>
          <div id="progressBar" class="progress mt-2 d-none">
            <div class="progress-bar progress-bar-striped progress-bar-animated" style="width:0%"></div>
          </div>
        </div>
      </div>

      <!-- 爬取筛选（传给爬虫） -->
      <div class="card">
        <div class="card-body">
          <div class="section-label">爬取筛选（留空则不筛选，爬虫只采集符合条件的书）</div>
          <div class="filter-row">
            <label>书名关键词</label>
            <input type="text" id="cName" class="form-control form-control-sm" placeholder="模糊匹配">
          </div>
          <div class="filter-row">
            <label>作者关键词</label>
            <input type="text" id="cAuthor" class="form-control form-control-sm" placeholder="模糊匹配">
          </div>
          <div class="filter-row">
            <label>出版社关键词</label>
            <input type="text" id="cPublisher" class="form-control form-control-sm" placeholder="模糊匹配">
          </div>
          <div class="row g-1">
            <div class="col-6 filter-row">
              <label>最低评分</label>
              <input type="number" id="cRateMin" class="form-control form-control-sm" placeholder="0" min="0" max="100" step="1">
            </div>
            <div class="col-6 filter-row">
              <label>最高评分</label>
              <input type="number" id="cRateMax" class="form-control form-control-sm" placeholder="100" min="0" max="100" step="1">
            </div>
          </div>
          <div class="row g-1">
            <div class="col-6 filter-row">
              <label>最低价格</label>
              <input type="number" id="cPriceMin" class="form-control form-control-sm" placeholder="0" min="0" step="0.01">
            </div>
            <div class="col-6 filter-row">
              <label>最高价格</label>
              <input type="number" id="cPriceMax" class="form-control form-control-sm" placeholder="" min="0" step="0.01">
            </div>
          </div>
          <div class="filter-row">
            <label>最低评论人数</label>
            <input type="number" id="cPeopleMin" class="form-control form-control-sm" placeholder="0" min="0">
          </div>
        </div>
      </div>

      <!-- 结果筛选（查询已爬数据） -->
      <div class="card">
        <div class="card-body">
          <div class="section-label">结果筛选（浏览已爬数据） <button class="btn btn-link btn-sm p-0 float-end" onclick="clearFilters()">清除</button></div>
          <div class="filter-row">
            <label>书名</label>
            <input type="text" id="fName" class="form-control form-control-sm" placeholder="模糊搜索">
          </div>
          <div class="filter-row">
            <label>作者</label>
            <input type="text" id="fAuthor" class="form-control form-control-sm" placeholder="模糊搜索">
          </div>
          <div class="filter-row">
            <label>出版社</label>
            <input type="text" id="fPublisher" class="form-control form-control-sm" placeholder="模糊搜索">
          </div>
          <div class="row g-1">
            <div class="col-6 filter-row">
              <label>最低评分</label>
              <input type="number" id="fRateMin" class="form-control form-control-sm" placeholder="0" min="0" max="100" step="1">
            </div>
            <div class="col-6 filter-row">
              <label>最高评分</label>
              <input type="number" id="fRateMax" class="form-control form-control-sm" placeholder="100" min="0" max="100" step="1">
            </div>
          </div>
          <div class="row g-1">
            <div class="col-6 filter-row">
              <label>最低价格</label>
              <input type="number" id="fPriceMin" class="form-control form-control-sm" placeholder="0" min="0" step="0.01">
            </div>
            <div class="col-6 filter-row">
              <label>最高价格</label>
              <input type="number" id="fPriceMax" class="form-control form-control-sm" placeholder="" min="0" step="0.01">
            </div>
          </div>
          <div class="filter-row">
            <label>最低评论人数</label>
            <input type="number" id="fPeopleMin" class="form-control form-control-sm" placeholder="0" min="0">
          </div>
          <button class="btn btn-primary btn-sm w-100 mt-1" onclick="loadBooks(1)">筛选</button>
        </div>
      </div>
    </div>

    <!-- ===== 右栏 ===== -->
    <div class="col-lg-9">
      <div class="card">
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <h6 class="card-title mb-0">数据列表 <span class="text-muted" style="font-size:12px" id="totalLabel"></span></h6>
            <div>
              <button class="btn btn-outline-danger btn-sm me-1" onclick="clearData()">清除数据</button>
              <button class="btn btn-outline-success btn-sm" onclick="window.open('/api/books?'+resultParams(10000), '_blank')">导出 CSV</button>
            </div>
          </div>
          <div id="tableContainer">
            <table class="table table-sm table-hover mb-0" style="min-width:900px">
              <thead class="table-light sticky-top">
                <tr>
                  <th>书名</th>
                  <th>作者</th>
                  <th>出版社</th>
                  <th style="cursor:pointer" onclick="sortBy('price')">价格</th>
                  <th style="cursor:pointer" onclick="sortBy('rating')">评分</th>
                  <th style="cursor:pointer" onclick="sortBy('rating_people')">评论数</th>
                </tr>
              </thead>
              <tbody id="bookTableBody"></tbody>
            </table>
          </div>
          <nav class="mt-2" id="pagination"></nav>
        </div>
      </div>

      <div class="row g-3 mt-0">
        <div class="col-md-6">
          <div class="card"><div class="card-body"><h6 class="card-title">评分分布</h6><div id="chartRating" class="chart-box"></div></div></div>
        </div>
        <div class="col-md-6">
          <div class="card"><div class="card-body"><h6 class="card-title">价格分布</h6><div id="chartPrice" class="chart-box"></div></div></div>
        </div>
        <div class="col-md-6">
          <div class="card"><div class="card-body"><h6 class="card-title">热门出版社 Top10</h6><div id="chartPub" class="chart-box"></div></div></div>
        </div>
        <div class="col-md-6">
          <div class="card"><div class="card-body"><h6 class="card-title">价格 vs 评分</h6><div id="chartScatter" class="chart-box"></div></div></div>
        </div>
      </div>
    </div>

  </div>
</div>

<script>
let currentSort = 'id', currentOrder = 'desc', currentPage = 1;
let statusTimer = null;

// ---- 爬虫控制 ----
function startCrawl() {
  const body = {
    item_count: parseInt(document.getElementById('itemCount').value) || 0,
    name_filter: document.getElementById('cName').value.trim(),
    author_filter: document.getElementById('cAuthor').value.trim(),
    publisher_filter: document.getElementById('cPublisher').value.trim(),
    rating_min: document.getElementById('cRateMin').value.trim(),
    rating_max: document.getElementById('cRateMax').value.trim(),
    price_min: document.getElementById('cPriceMin').value.trim(),
    price_max: document.getElementById('cPriceMax').value.trim(),
    people_min: document.getElementById('cPeopleMin').value.trim(),
  };
  fetch('/api/crawl/start', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(body)
  }).then(r => r.json()).then(d => {
    if (d.ok) { setRunning(true, 'dangdang'); monitorStatus(); }
    else alert(d.message);
  }).catch(e => alert('启动爬虫失败: ' + e.message));
}

function startDetail() {
  fetch('/api/crawl/detail', {method: 'POST'}).then(r => r.json()).then(d => {
    if (d.ok) { setRunning(true, 'dangdang_detail'); monitorStatus(); }
    else alert(d.message);
  }).catch(e => alert('启动详情补抓失败: ' + e.message));
}

function setRunning(running, spider) {
  document.getElementById('btnCrawl').disabled = running;
  document.getElementById('btnDetail').disabled = running;
  document.getElementById('btnStop').disabled = !running;
  const el = document.getElementById('crawlStatus');
  const bar = document.getElementById('progressBar');
  if (running) {
    el.className = 'status-running';
    el.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>' + spider + ' 启动中...';
    bar.classList.remove('d-none');
    bar.querySelector('.progress-bar').style.width = '0%';
    bar.querySelector('.progress-bar').textContent = '';
  } else {
    bar.classList.add('d-none');
  }
}

function monitorStatus() {
  if (statusTimer) clearInterval(statusTimer);
  const el = document.getElementById('crawlStatus');
  const bar = document.getElementById('progressBar');
  const pb = bar.querySelector('.progress-bar');
  statusTimer = setInterval(() => {
    fetch('/api/crawl/status').then(r => r.json()).then(d => {
      if (!d.running) {
        clearInterval(statusTimer); statusTimer = null;
        bar.classList.add('d-none');
        el.className = d.exit_code === 0 ? 'status-idle' : 'status-error';
        const took = d.elapsed ? ' (耗时 ' + d.elapsed + ')' : '';
        const msg = d.exit_code === 0 ? '完成' : '异常退出 (code=' + d.exit_code + ')';
        el.innerHTML = '&#9679; ' + msg + took;
        document.getElementById('btnCrawl').disabled = false;
        document.getElementById('btnDetail').disabled = false;
        document.getElementById('btnStop').disabled = true;
        loadBooks(1); loadStats();
      } else {
        el.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>' + d.spider + ' 运行中... ' + (d.elapsed || '');
        if (d.progress !== null && d.progress !== undefined) {
          const pct = d.progress;
          pb.style.width = pct + '%';
          pb.textContent = typeof pct === 'number' && pct <= 100 ? pct + '%' : pct + ' 条';
        } else {
          pb.style.width = '100%';
          pb.textContent = '';
        }
      }
    }).catch(() => {});  // 状态轮询失败静默忽略，下个周期重试
  }, 2000);
}

// ---- 结果筛选参数 ----
function resultParams(skipLimit) {
  const getVal = id => document.getElementById(id)?.value?.trim() || '';
  const v = (id, fn) => { const x = getVal(id); return x ? fn(x) : null; };
  const p = new URLSearchParams();
  const name = getVal('fName'), author = getVal('fAuthor'), pub = getVal('fPublisher');
  if (name) p.set('name', name);
  if (author) p.set('author', author);
  if (pub) p.set('publisher', pub);
  const rmin = v('fRateMin', parseFloat), rmax = v('fRateMax', parseFloat);
  if (rmin !== null) p.set('rating_min', rmin);
  if (rmax !== null) p.set('rating_max', rmax);
  const pmin = v('fPriceMin', parseFloat), pmax = v('fPriceMax', parseFloat);
  if (pmin !== null) p.set('price_min', pmin);
  if (pmax !== null) p.set('price_max', pmax);
  const ppl = v('fPeopleMin', parseInt);
  if (ppl !== null) p.set('people_min', ppl);
  p.set('sort_by', currentSort);
  p.set('sort_order', currentOrder);
  p.set('page', skipLimit ? '1' : currentPage);
  p.set('per_page', skipLimit || 20);
  return p.toString();
}

// ---- 书籍查询 ----
function clearData() {
  if (!confirm('确定要清空数据库中的所有书籍数据吗？此操作不可恢复。')) return;
  fetch('/api/books/clear', {method: 'POST'}).then(r => r.json()).then(d => {
    if (d.ok) { alert(d.message); }
    else { alert(d.message); }
    document.getElementById('bookTableBody').innerHTML = '<tr><td colspan="6" class="text-center text-muted">数据已清除，点击"筛选"加载</td></tr>';
    document.getElementById('totalLabel').textContent = '';
    document.getElementById('pagination').innerHTML = '';
    Object.values(charts).forEach(c => c?.dispose());
    charts = {};
    ['chartRating','chartPrice','chartPub','chartScatter'].forEach(id => { const dom = document.getElementById(id); if (dom) dom.innerHTML = ''; });
  }).catch(e => alert('清空失败: ' + e.message));
}

function stopCrawl() {
  fetch('/api/crawl/stop', {method: 'POST'}).then(r => r.json()).then(d => {
    alert(d.message);
    setRunning(false);
  }).catch(e => alert('停止失败: ' + e.message));
}
function loadBooks(page) {
  currentPage = page || currentPage;
  fetch('/api/books?' + resultParams()).then(r => r.json()).then(d => {
    if (!d.ok) { alert(d.message || '查询失败'); return; }
    document.getElementById('totalLabel').textContent = '(共 ' + d.total + ' 条)';
    let html = '';
    d.books.forEach(b => {
      html += '<tr><td class="name-col" title="' + esc(b.name) + '">' + esc(b.name || '-') + '</td>'
        + '<td>' + esc(b.author || '-') + '</td>'
        + '<td>' + esc(b.publisher || '-') + '</td>'
        + '<td>' + (b.price != null ? '¥' + b.price.toFixed(2) : '-') + '</td>'
        + '<td>' + (b.rating != null ? b.rating.toFixed(1) : '-') + '</td>'
        + '<td>' + (b.rating_people != null ? b.rating_people.toLocaleString() : '-') + '</td></tr>';
    });
    if (!d.books.length) html = '<tr><td colspan="6" class="text-center text-muted">暂无数据</td></tr>';
    document.getElementById('bookTableBody').innerHTML = html;
    let pg = '';
    for (let i = 1; i <= d.total_pages; i++) {
      pg += '<li class="page-item' + (i === d.page ? ' active' : '') + '"><span class="page-link" onclick="loadBooks(' + i + ')">' + i + '</span></li>';
    }
    document.getElementById('pagination').innerHTML = '<ul class="pagination pagination-sm mb-0">' + pg + '</ul>';
  }).catch(e => {
    document.getElementById('bookTableBody').innerHTML = '<tr><td colspan="6" class="text-center text-danger">加载失败: ' + esc(e.message) + '</td></tr>';
  });
}

function sortBy(col) {
  if (currentSort === col) currentOrder = currentOrder === 'asc' ? 'desc' : 'asc';
  else { currentSort = col; currentOrder = 'desc'; }
  loadBooks(1);
}

function clearFilters() {
  ['fName','fAuthor','fPublisher','fRateMin','fRateMax','fPriceMin','fPriceMax','fPeopleMin'].forEach(id => {
    document.getElementById(id).value = '';
  });
  loadBooks(1);
}

function esc(s) { if (!s) return ''; return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// ---- 图表 ----
let charts = {};
function initChart(id) {
  const dom = document.getElementById(id);
  if (!dom) return null;
  if (charts[id]) charts[id].dispose();
  const c = echarts.init(dom);
  charts[id] = c;
  return c;
}

function loadStats() {
  fetch('/api/stats').then(r => r.json()).then(d => {
    if (!d.ok || d.total === 0) return;
    const c1 = initChart('chartRating');
    if (c1) c1.setOption({
      tooltip: {trigger: 'axis'},
      xAxis: {data: d.rating_distribution.map(i => i.label), axisLabel: {fontSize: 10}},
      yAxis: {},
      series: [{type: 'bar', data: d.rating_distribution.map(i => i.count), itemStyle: {color: '#5470c6'}}],
      grid: {left: 40, right: 10, top: 10, bottom: 30}
    });
    const c2 = initChart('chartPrice');
    if (c2) c2.setOption({
      tooltip: {trigger: 'axis'},
      xAxis: {data: d.price_distribution.map(i => i.label), axisLabel: {fontSize: 9, rotate: 45}},
      yAxis: {},
      series: [{type: 'bar', data: d.price_distribution.map(i => i.count), itemStyle: {color: '#91cc75'}}],
      grid: {left: 40, right: 10, top: 10, bottom: 45}
    });
    const c3 = initChart('chartPub');
    if (c3) c3.setOption({
      tooltip: {trigger: 'axis'},
      yAxis: {type: 'category', data: d.top_publishers.map(i => i.name).reverse(), axisLabel: {fontSize: 9}},
      xAxis: {type: 'value'},
      series: [{type: 'bar', data: d.top_publishers.map(i => i.count).reverse(), itemStyle: {color: '#fac858'}}],
      grid: {left: 100, right: 10, top: 10, bottom: 20}
    });
    const c4 = initChart('chartScatter');
    if (c4) c4.setOption({
      tooltip: {formatter: p => '¥' + p.value[0] + ' 评分:' + p.value[1]},
      xAxis: {name: '价格', nameTextStyle: {fontSize: 10}},
      yAxis: {name: '评分', nameTextStyle: {fontSize: 10}},
      series: [{type: 'scatter', data: d.scatter.map(i => [i.price, i.rating]), symbolSize: 6, itemStyle: {opacity: 0.5, color: '#ee6666'}}],
      grid: {left: 50, right: 10, top: 10, bottom: 30}
    });
  }).catch(e => console.error('统计加载失败:', e));
}

loadBooks(1);
loadStats();
window.addEventListener('resize', () => Object.values(charts).forEach(c => c?.resize()));

// 检查初始状态
fetch('/api/crawl/status').then(r => r.json()).then(d => { if (d.running) { setRunning(true, d.spider); monitorStatus(); } }).catch(() => {});
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
